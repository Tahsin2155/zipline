{% extends "base.html" %}
{% block title %}Login - DTI{% endblock %}
{% block content %}
<div class="login-container">
    <div class="card">
        <div class="card-body p-4 p-sm-5">
            <div class="text-center mb-4">
                <i class="bi bi-cloud-arrow-up-fill fs-1 text-dark mb-2 d-block"></i>
                <h3 class="card-title fw-bold" style="color: #0f172a;">Welcome back</h3>
                <p class="text-muted small">Sign in to access your files</p>
            </div>

            <form method="POST" action="{{ url_for('auth.login') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username" required autocomplete="off" placeholder="Enter username">
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required placeholder="Enter password">
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2">Sign In</button>
            </form>

            <hr class="my-4">
            <p class="text-center text-muted small mb-0">
                Need an account? <br>Please contact the system administrator.
            </p>
        </div>
    </div>
</div>
{% endblock %}
